<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Control — pepc84</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Space Grotesk', sans-serif; background: #f5f5f3; color: #111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }

    /* Login */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 1rem; width: 100%; max-width: 360px; }
    #login-screen h1 { font-size: 1.5rem; }
    #login-screen input { width: 100%; padding: 0.65rem 0.9rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
    #login-screen input:focus { outline: none; border-color: #e8b400; }
    #login-btn { width: 100%; background: #e8b400; color: #111; border: none; border-radius: 8px; padding: 0.65rem; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    #login-btn:hover { background: #d4a400; }
    #login-error { color: #c00; font-size: 0.85rem; min-height: 1.2em; }

    /* Main UI */
    #main-screen { display: none; flex-direction: column; align-items: center; gap: 1.25rem; width: 100%; max-width: 480px; }
    #main-screen h1 { font-size: 1.3rem; align-self: flex-start; }

    /* Status */
    .status-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #777; align-self: flex-start; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .dot.online { background: #2a7a2a; }
    .dot.offline { background: #c00; }

    /* Power */
    .power-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    #power-btn {
      width: 72px; height: 72px; border-radius: 50%;
      border: 3px solid #111; background: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    #power-btn:active { transform: scale(0.93); background: #f0f0f0; }
    #power-btn.holding { border-color: #c00; }
    #power-btn svg { pointer-events: none; }
    .power-hint { font-size: 0.75rem; color: #999; }

    /* Shortcuts */
    .shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; width: 100%; }
    .shortcut-btn {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
      padding: 0.75rem 0.4rem; font-family: inherit; font-size: 0.78rem;
      font-weight: 500; cursor: pointer; text-align: center;
      transition: background 0.1s, transform 0.1s;
    }
    .shortcut-btn:active { background: #e8b400; transform: scale(0.95); }
    .shortcut-icon { font-size: 1.2rem; display: block; margin-bottom: 0.2rem; }

    /* Trackpad */
    .trackpad-label { align-self: flex-start; font-size: 0.85rem; color: #777; }
    #trackpad {
      width: 100%; height: 200px; background: #fff;
      border: 1px solid #e0e0e0; border-radius: 14px;
      touch-action: none; cursor: crosshair; position: relative;
      user-select: none;
    }
    .trackpad-hint { font-size: 0.75rem; color: #bbb; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .click-btns { display: flex; gap: 0.5rem; width: 100%; }
    .click-btn { flex: 1; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 0.6rem; font-family: inherit; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
    .click-btn:active { background: #e8b400; }

    /* Type */
    .type-row { display: flex; gap: 0.5rem; width: 100%; }
    #type-input { flex: 1; padding: 0.6rem 0.85rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 0.9rem; }
    #type-input:focus { outline: none; border-color: #e8b400; }
    #type-btn { background: #e8b400; color: #111; border: none; border-radius: 8px; padding: 0.6rem 1rem; font-family: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <h1>PC Control</h1>
  <input id="u-input" type="text" placeholder="Username" autocomplete="username">
  <input id="p-input" type="password" placeholder="Password" autocomplete="current-password">
  <button id="login-btn">Sign in</button>
  <p id="login-error"></p>
</div>

<!-- Main -->
<div id="main-screen">
  <h1>PC Control</h1>
  <div class="status-row">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Checking…</span>
  </div>

  <!-- Power -->
  <div class="power-wrap">
    <button id="power-btn" title="Hold 5s to force off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32">
        <path d="M12 2v6M6.3 5.3a9 9 0 1 0 11.4 0"/>
      </svg>
    </button>
    <span class="power-hint">Tap = press · Hold 5s = force off</span>
  </div>

  <!-- Shortcuts -->
  <div class="shortcuts">
    <button class="shortcut-btn" data-cmd="lock"><span class="shortcut-icon">🔒</span>Lock</button>
    <button class="shortcut-btn" data-cmd="sleep"><span class="shortcut-icon">💤</span>Sleep</button>
    <button class="shortcut-btn" data-cmd="desktop"><span class="shortcut-icon">🖥️</span>Desktop</button>
    <button class="shortcut-btn" data-cmd="screenshot"><span class="shortcut-icon">📸</span>Screenshot</button>
    <button class="shortcut-btn" data-cmd="voldown"><span class="shortcut-icon">🔉</span>Vol −</button>
    <button class="shortcut-btn" data-cmd="mute"><span class="shortcut-icon">🔇</span>Mute</button>
    <button class="shortcut-btn" data-cmd="volup"><span class="shortcut-icon">🔊</span>Vol +</button>
    <button class="shortcut-btn" data-cmd="task"><span class="shortcut-icon">📋</span>Task Mgr</button>
  </div>

  <!-- Trackpad -->
  <span class="trackpad-label">Trackpad</span>
  <div id="trackpad"><div class="trackpad-hint">slide to move · tap to left-click</div></div>
  <div class="click-btns">
    <button class="click-btn" onclick="api('/mouse','mc:1')">Left click</button>
    <button class="click-btn" onclick="api('/mouse','mc:2')">Right click</button>
  </div>

  <!-- Type -->
  <div class="type-row">
    <input id="type-input" type="text" placeholder="Type text…">
    <button id="type-btn">Send</button>
  </div>
</div>

<script>
const BASE = 'https://pc.pepc84.com';

async function api(endpoint, cmd) {
  try {
    await fetch(BASE + endpoint, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd })
    });
  } catch {}
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function checkAuth() {
  try {
    const r = await fetch(BASE + '/me', { credentials: 'include' });
    if (r.ok) showMain();
  } catch {}
}

async function login() {
  const u = document.getElementById('u-input').value;
  const p = document.getElementById('p-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const r = await fetch(BASE + '/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    if (r.ok) { showMain(); }
    else { err.textContent = 'Wrong username or password.'; }
  } catch { err.textContent = 'Cannot reach ESP32.'; }
}

function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display  = 'flex';
  pollStatus();
  setInterval(pollStatus, 10000);
}

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('p-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ── Status ───────────────────────────────────────────────────────────────────
async function pollStatus() {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  try {
    const r = await fetch(BASE + '/status', { credentials: 'include', signal: AbortSignal.timeout(4000) });
    if (r.ok) {
      dot.className = 'dot online';
      text.textContent = 'ESP32 online';
    } else throw new Error();
  } catch {
    dot.className = 'dot offline';
    text.textContent = 'ESP32 offline';
  }
}

// ── Power button ─────────────────────────────────────────────────────────────
let powerTimer = null;
const powerBtn = document.getElementById('power-btn');

powerBtn.addEventListener('pointerdown', () => {
  powerBtn.classList.add('holding');
  powerTimer = setTimeout(() => {
    api('/power', 'hold');
    powerTimer = null;
  }, 5000);
});

function powerUp() {
  if (powerTimer) {
    clearTimeout(powerTimer);
    powerTimer = null;
    api('/power', 'press');
  }
  powerBtn.classList.remove('holding');
}
powerBtn.addEventListener('pointerup', powerUp);
powerBtn.addEventListener('pointerleave', powerUp);

// ── Shortcuts ─────────────────────────────────────────────────────────────────
document.querySelectorAll('.shortcut-btn').forEach(btn => {
  btn.addEventListener('click', () => api('/key', btn.dataset.cmd));
});

// ── Trackpad ─────────────────────────────────────────────────────────────────
const pad = document.getElementById('trackpad');
let lastX = null, lastY = null, moved = false, padTimer = null;
const SENSITIVITY = 1.5;

function padStart(x, y) { lastX = x; lastY = y; moved = false; }
function padMove(x, y) {
  if (lastX === null) return;
  const dx = Math.round((x - lastX) * SENSITIVITY);
  const dy = Math.round((y - lastY) * SENSITIVITY);
  if (dx !== 0 || dy !== 0) {
    api('/mouse', `m:${dx},${dy}`);
    moved = true;
  }
  lastX = x; lastY = y;
}
function padEnd() {
  if (!moved) api('/mouse', 'mc:1'); // tap = left click
  lastX = null; lastY = null; moved = false;
}

pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); padStart(e.clientX, e.clientY); });
pad.addEventListener('pointermove', e => padMove(e.clientX, e.clientY));
pad.addEventListener('pointerup',   () => padEnd());
pad.addEventListener('pointercancel', () => { lastX = null; });

// ── Type ──────────────────────────────────────────────────────────────────────
document.getElementById('type-btn').addEventListener('click', () => {
  const val = document.getElementById('type-input').value;
  if (val) { api('/mouse', 'type:' + val); document.getElementById('type-input').value = ''; }
});

// ── Init ──────────────────────────────────────────────────────────────────────
checkAuth();
</script>
</body>
</html>

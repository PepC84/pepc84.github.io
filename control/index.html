<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PC Control — pepc84</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      background: #f5f5f3;
      color: #111;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Login ── */
    #login-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 1rem; padding: 2rem;
    }
    #login-screen h1 { font-size: 1.5rem; }
    #login-screen input {
      width: 100%; max-width: 320px; padding: 0.65rem 0.9rem;
      border: 1px solid #ddd; border-radius: 8px;
      font-family: inherit; font-size: 0.95rem;
      touch-action: auto; user-select: auto; -webkit-user-select: auto;
    }
    #login-screen input:focus { outline: none; border-color: #e8b400; }
    #login-btn {
      width: 100%; max-width: 320px;
      background: #e8b400; color: #111; border: none; border-radius: 8px;
      padding: 0.65rem; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    #login-btn:active { background: #d4a400; }
    #login-error { color: #c00; font-size: 0.85rem; min-height: 1.2em; }

    /* ── Main layout ── */
    #main-screen { display: none; flex-direction: column; height: 100%; }

    /* Top bar */
    .top-bar {
      flex-shrink: 0;
      padding: 0.75rem 1rem 0.6rem;
      display: flex; flex-direction: column; gap: 0.6rem;
      background: #f5f5f3;
    }
    .title-row { display: flex; align-items: center; justify-content: space-between; }
    .title-row h1 { font-size: 1.1rem; }
    .status-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: #777; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; }
    .dot.online  { background: #2a7a2a; }
    .dot.offline { background: #c00; }

    .power-row { display: flex; align-items: center; gap: 1rem; }
    #power-btn {
      width: 52px; height: 52px; border-radius: 50%;
      border: 2.5px solid #111; background: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.12s, transform 0.08s;
    }
    #power-btn:active { transform: scale(0.91); background: #f0f0f0; }
    #power-btn.holding { border-color: #c00; }
    #power-btn svg { pointer-events: none; }
    .power-hint { font-size: 0.72rem; color: #999; }


    /* ── Trackpad zone ── */
    #trackpad-zone {
      flex: 1;
      position: relative;
      background: #ebe9e5;
      border-top: 1px solid #d8d6d2;
      cursor: crosshair;
      overflow: hidden;
    }
    .pad-hint {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; color: #bbb;
      pointer-events: none;
    }
    .ripple {
      position: absolute; border-radius: 50%;
      width: 60px; height: 60px;
      background: rgba(0,0,0,0.09);
      transform: translate(-50%, -50%) scale(0);
      animation: ripple 0.35s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple { to { transform: translate(-50%,-50%) scale(2.5); opacity: 0; } }

    /* ── Bottom bar ── */
    .bottom-bar {
      flex-shrink: 0;
      padding: 0.55rem 1rem 0.8rem;
      background: #f5f5f3;
      border-top: 1px solid #e0e0e0;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .click-btns { display: flex; gap: 0.5rem; }
    .click-btn {
      flex: 1; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 0.55rem; font-family: inherit; font-size: 0.82rem; font-weight: 500; cursor: pointer;
    }
    .click-btn:active { background: #e8b400; }

    .type-row { display: flex; gap: 0.5rem; align-items: stretch; }
    #type-input {
      flex: 1; padding: 0.55rem 0.8rem; border: 1px solid #ddd; border-radius: 8px;
      font-family: inherit; font-size: 0.88rem;
      touch-action: auto; user-select: auto; -webkit-user-select: auto;
    }
    #type-input:focus { outline: none; border-color: #e8b400; }
    #type-btn {
      background: #e8b400; color: #111; border: none; border-radius: 8px;
      padding: 0.55rem 1rem; font-family: inherit; font-weight: 600; cursor: pointer;
      white-space: nowrap; font-size: 0.88rem;
      transition: background 0.15s;
    }
    #type-btn.ok  { background: #2a7a2a; color: #fff; }
    #type-btn.err { background: #c00;    color: #fff; }

    /* Toast */
    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 0.4rem 1rem; border-radius: 20px;
      font-size: 0.8rem; pointer-events: none;
      opacity: 0; transition: opacity 0.2s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <h1>PC Control</h1>
  <input id="u-input" type="text" placeholder="Username" autocomplete="username">
  <input id="p-input" type="password" placeholder="Password" autocomplete="current-password">
  <button id="login-btn">Sign in</button>
  <p id="login-error"></p>
</div>

<!-- Main -->
<div id="main-screen">

  <div class="top-bar">
    <div class="title-row">
      <h1>PC Control</h1>
      <div class="status-row">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">Checking…</span>
      </div>
    </div>

    <div class="power-row">
      <button id="power-btn" title="Hold 5s to force off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26">
          <path d="M12 2v6M6.3 5.3a9 9 0 1 0 11.4 0"/>
        </svg>
      </button>
      <span class="power-hint">Tap = press · Hold 5 s = force off</span>
    </div>

  </div>

  <div id="trackpad-zone">
    <div class="pad-hint">slide to move · tap to click</div>
  </div>

  <div class="bottom-bar">
    <div class="click-btns">
      <button class="click-btn" id="lclick-btn">Left click</button>
      <button class="click-btn" id="rclick-btn">Right click</button>
    </div>
    <div class="type-row">
      <input id="type-input" type="text" placeholder="Type on PC… (click a field first)">
      <button id="type-btn">Send</button>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
const BASE = 'https://pc.pepc84.com';

// Fire-and-forget
function api(endpoint, cmd) {
  fetch(BASE + endpoint, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cmd })
  }).catch(() => {});
}

// Toast
let toastTimer;
function toast(msg, dur = 1500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function checkAuth() {
  try {
    const r = await fetch(BASE + '/me', { credentials: 'include' });
    if (r.ok) showMain();
  } catch {}
}

async function login() {
  const u = document.getElementById('u-input').value;
  const p = document.getElementById('p-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const r = await fetch(BASE + '/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    if (r.ok) showMain();
    else err.textContent = 'Wrong username or password.';
  } catch { err.textContent = 'Cannot reach ESP32.'; }
}

function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display  = 'flex';
  pollStatus();
  setInterval(pollStatus, 10000);
}

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('p-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ── Status ───────────────────────────────────────────────────────────────────
async function pollStatus() {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  try {
    const r = await fetch(BASE + '/status', { credentials: 'include', signal: AbortSignal.timeout(4000) });
    if (r.ok) { dot.className = 'dot online'; text.textContent = 'ESP32 online'; }
    else throw 0;
  } catch { dot.className = 'dot offline'; text.textContent = 'ESP32 offline'; }
}

// ── Power ─────────────────────────────────────────────────────────────────────
let powerTimer = null;
let powerHeld  = false;
const powerBtn = document.getElementById('power-btn');

powerBtn.addEventListener('pointerdown', e => {
  e.stopPropagation();
  e.preventDefault();
  powerBtn.setPointerCapture(e.pointerId);
  powerHeld = false;
  powerBtn.classList.add('holding');
  powerTimer = setTimeout(() => {
    powerHeld = true;
    api('/power', 'hold');
    powerBtn.classList.remove('holding');
  }, 5000);
});

powerBtn.addEventListener('pointerup', e => {
  e.stopPropagation();
  powerBtn.classList.remove('holding');
  if (powerTimer) {
    clearTimeout(powerTimer);
    powerTimer = null;
  }
  if (!powerHeld) api('/power', 'press');
  powerHeld = false;
});

powerBtn.addEventListener('pointercancel', e => {
  clearTimeout(powerTimer); powerTimer = null;
  powerHeld = false;
  powerBtn.classList.remove('holding');
});

// ── Click buttons ─────────────────────────────────────────────────────────────
document.getElementById('lclick-btn').addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('rclick-btn').addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('lclick-btn').addEventListener('click', () => api('/mouse', 'mc:1'));
document.getElementById('rclick-btn').addEventListener('click', () => api('/mouse', 'mc:2'));

// ── Type ──────────────────────────────────────────────────────────────────────
const typeInput = document.getElementById('type-input');
const typeBtn   = document.getElementById('type-btn');

// Prevent trackpad from stealing pointer events on the input/button
typeInput.addEventListener('pointerdown', e => e.stopPropagation());
typeBtn.addEventListener('pointerdown',   e => e.stopPropagation());

async function sendType() {
  const val = typeInput.value;   // do NOT trim — preserve spaces
  if (!val) return;

  typeBtn.textContent = '…';
  typeBtn.disabled = true;

  try {
    const r = await fetch(BASE + '/mouse', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: 'type:' + val })
    });
    if (r.ok) {
      typeInput.value = '';
      typeBtn.classList.add('ok');
      typeBtn.textContent = 'Sent';
      toast('Typed: ' + val);
    } else {
      typeBtn.classList.add('err');
      typeBtn.textContent = 'Err';
      toast('ESP32 error');
    }
  } catch {
    typeBtn.classList.add('err');
    typeBtn.textContent = 'Err';
    toast('Cannot reach ESP32');
  }

  setTimeout(() => {
    typeBtn.classList.remove('ok', 'err');
    typeBtn.textContent = 'Send';
    typeBtn.disabled = false;
  }, 1200);
}

typeBtn.addEventListener('click', sendType);
typeInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendType(); } });

// ── Trackpad ──────────────────────────────────────────────────────────────────
const zone = document.getElementById('trackpad-zone');

let pt = null;
let accX = 0, accY = 0, lastSend = 0;
const SENS     = 2.2;
const THROTTLE = 40;   // ms between sends
const TAP_DIST = 8;    // px movement threshold for tap vs drag

function spawnRipple(x, y) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = x + 'px';
  r.style.top  = y + 'px';
  zone.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
}

zone.addEventListener('pointerdown', e => {
  zone.setPointerCapture(e.pointerId);
  pt = { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, moved: false };
  accX = accY = 0;
  e.preventDefault();
});

zone.addEventListener('pointermove', e => {
  if (!pt) return;
  const dx = (e.clientX - pt.x) * SENS;
  const dy = (e.clientY - pt.y) * SENS;
  accX += dx; accY += dy;
  pt.x = e.clientX; pt.y = e.clientY;

  if (Math.hypot(e.clientX - pt.startX, e.clientY - pt.startY) > TAP_DIST) pt.moved = true;

  const now = performance.now();
  if (now - lastSend >= THROTTLE) {
    const ix = Math.max(-127, Math.min(127, Math.round(accX)));
    const iy = Math.max(-127, Math.min(127, Math.round(accY)));
    if (ix !== 0 || iy !== 0) {
      api('/mouse', `m:${ix},${iy}`);
      accX -= ix; accY -= iy;
      lastSend = now;
    }
  }
});

zone.addEventListener('pointerup', e => {
  if (!pt) return;
  if (!pt.moved) {
    const rect = zone.getBoundingClientRect();
    spawnRipple(e.clientX - rect.left, e.clientY - rect.top);
    api('/mouse', 'mc:1');
  }
  pt = null; accX = accY = 0;
});

zone.addEventListener('pointercancel', () => { pt = null; accX = accY = 0; });

// ── Init ──────────────────────────────────────────────────────────────────────
checkAuth();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PC Control · pepc84</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      background: #f5f5f3; color: #111;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }

    /* ── Login ── */
    #login-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 1rem; padding: 2rem;
    }
    #login-screen h1 { font-size: 1.5rem; }
    #login-screen input {
      width: 100%; max-width: 320px; padding: 0.65rem 0.9rem;
      border: 1px solid #ddd; border-radius: 8px;
      font-family: inherit; font-size: 0.95rem;
      touch-action: auto; user-select: auto; -webkit-user-select: auto;
    }
    #login-screen input:focus { outline: none; border-color: #e8b400; }
    #login-btn {
      width: 100%; max-width: 320px; background: #e8b400; color: #111;
      border: none; border-radius: 8px; padding: 0.65rem;
      font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    #login-btn:active { background: #d4a400; }
    #login-error { color: #c00; font-size: 0.85rem; min-height: 1.2em; }

    /* ── Main ── */
    #main-screen { display: none; flex-direction: column; height: 100%; }

    .top-bar {
      flex-shrink: 0; padding: 0.7rem 1rem 0.55rem;
      display: flex; flex-direction: column; gap: 0.55rem;
      background: #f5f5f3;
    }
    .title-row { display: flex; align-items: center; justify-content: space-between; }
    .title-row h1 { font-size: 1.05rem; }
    .title-actions { display: flex; align-items: center; gap: 0.6rem; }
    .status-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: #777; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; }
    .dot.online  { background: #2a7a2a; }
    .dot.offline { background: #c00; }

    /* Camera toggle */
    #cam-toggle {
      background: none; border: 1px solid #ddd; border-radius: 7px;
      padding: 0.3rem 0.55rem; font-size: 1rem; cursor: pointer; line-height: 1;
    }
    #cam-toggle.active { border-color: #e8b400; background: #fffbe6; }

    .power-row { display: flex; align-items: center; gap: 1rem; }
    .power-wrap { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
    #power-btn {
      width: 52px; height: 52px; border-radius: 50%;
      border: 2.5px solid #111; background: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, transform 0.08s;
      -webkit-touch-callout: none;
    }
    #power-btn:active { transform: scale(0.91); background: #f0f0f0; }
    #power-btn svg { pointer-events: none; }
    /* SVG progress ring overlay */
    #power-ring {
      position: absolute; inset: 0; pointer-events: none;
      transform: rotate(-90deg);
    }
    #power-ring circle {
      fill: none; stroke: #c00; stroke-width: 3;
      stroke-dasharray: 0 152; /* circumference ≈ 152 */
      transition: stroke-dasharray 0.1s linear;
      stroke-linecap: round;
    }
    .power-hint { font-size: 0.7rem; color: #999; }

    /* ── Trackpad ── */
    #trackpad-zone {
      flex: 1; position: relative; background: #ebe9e5;
      border-top: 1px solid #d8d6d2; overflow: hidden;
    }
    .pad-hint {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; color: #bbb; pointer-events: none;
    }
    .ripple {
      position: absolute; border-radius: 50%; width: 60px; height: 60px;
      background: rgba(0,0,0,0.09);
      transform: translate(-50%,-50%) scale(0);
      animation: ripple 0.35s ease-out forwards; pointer-events: none;
    }
    @keyframes ripple { to { transform: translate(-50%,-50%) scale(2.5); opacity: 0; } }

    /* ── Bottom ── */
    .bottom-bar {
      flex-shrink: 0; padding: 0.5rem 1rem 0.75rem;
      background: #f5f5f3; border-top: 1px solid #e0e0e0;
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .click-btns { display: flex; gap: 0.5rem; }
    .click-btn {
      flex: 1; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 0.5rem; font-family: inherit; font-size: 0.82rem; font-weight: 500; cursor: pointer;
    }
    .click-btn:active { background: #e8b400; }

    .servo-row {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .servo-row label { font-size: 0.82rem; font-weight: 500; white-space: nowrap; }
    #servo-slider {
      flex: 1; accent-color: #e8b400;
      touch-action: auto;
    }
    #servo-val { font-size: 0.82rem; color: #555; width: 2.2rem; text-align: right; }
    #servo-btn {
      background: #e8b400; color: #111; border: none; border-radius: 8px;
      padding: 0.5rem 0.75rem; font-family: inherit; font-weight: 600;
      font-size: 0.82rem; cursor: pointer; white-space: nowrap;
    }
    #servo-btn:active { background: #d4a400; }

    .type-row { display: flex; gap: 0.5rem; align-items: stretch; }
    #type-input {
      flex: 1; padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 8px;
      font-family: inherit; font-size: 0.88rem;
      touch-action: auto; user-select: auto; -webkit-user-select: auto;
    }
    #type-input:focus { outline: none; border-color: #e8b400; }
    #type-btn {
      background: #e8b400; color: #111; border: none; border-radius: 8px;
      padding: 0.5rem 0.9rem; font-family: inherit; font-weight: 600; cursor: pointer;
      font-size: 0.88rem; white-space: nowrap; transition: background 0.15s;
    }
    #type-btn:active { background: #d4a400; }
    #type-btn.ok  { background: #2a7a2a; color: #fff; }
    #type-btn.err { background: #c00;    color: #fff; }

    /* ── Webcam overlay ── */
    #cam-panel {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: #000; flex-direction: column; position: fixed;
    }
    #cam-panel.open { display: flex; }
    #cam-img {
      flex: 1; width: 100%; object-fit: contain;
      transform-origin: center center;
      will-change: transform;
      cursor: zoom-in;
    }
    #cam-loading {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #fff; font-size: 0.9rem; opacity: 0.6;
      pointer-events: none;
    }
    .cam-bar {
      display: flex; gap: 0.5rem; padding: 0.6rem 1rem;
      background: rgba(0,0,0,0.7);
    }
    .cam-bar button {
      flex: 1; background: rgba(255,255,255,0.15); color: #fff;
      border: 1px solid rgba(255,255,255,0.25); border-radius: 8px;
      padding: 0.5rem; font-family: inherit; font-size: 0.85rem; cursor: pointer;
    }
    .cam-bar button:active { background: rgba(255,255,255,0.3); }

    /* Zoom overlay buttons */
    #cam-zoom-overlay {
      position: absolute; top: 0.6rem; right: 0.6rem;
      display: flex; flex-direction: column; gap: 0.35rem;
      z-index: 10;
    }
    #cam-zoom-overlay button {
      width: 36px; height: 36px;
      background: rgba(0,0,0,0.55); color: #fff;
      border: 1px solid rgba(255,255,255,0.25); border-radius: 8px;
      font-family: inherit; font-size: 1rem; font-weight: 600;
      cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    #cam-zoom-overlay button:active { background: rgba(255,255,255,0.25); }
    #cam-zoom-reset { font-size: 0.6rem !important; }

    /* Toast */
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 0.35rem 1rem; border-radius: 20px;
      font-size: 0.78rem; pointer-events: none;
      opacity: 0; transition: opacity 0.2s; white-space: nowrap; z-index: 50;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <h1>PC Control</h1>
  <input id="u-input" type="text" placeholder="Username" autocomplete="username">
  <input id="p-input" type="password" placeholder="Password" autocomplete="current-password">
  <button id="login-btn">Sign in</button>
  <p id="login-error"></p>
</div>

<!-- Main -->
<div id="main-screen">
  <div class="top-bar">
    <div class="title-row">
      <h1>PC Control</h1>
      <div class="title-actions">
        <div class="status-row">
          <div class="dot" id="status-dot"></div>
          <span id="status-text">Checking…</span>
        </div>
        <button id="cam-toggle" title="Webcam">📷</button>
      </div>
    </div>
    <div class="power-row">
      <div class="power-wrap">
        <button id="power-btn" title="Hold 5s to force off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26">
            <path d="M12 2v6M6.3 5.3a9 9 0 1 0 11.4 0"/>
          </svg>
        </button>
        <svg id="power-ring" viewBox="0 0 52 52" width="52" height="52">
          <circle cx="26" cy="26" r="24"/>
        </svg>
      </div>
      <span class="power-hint">Tap = press · Hold 5 s = force off</span>
    </div>
  </div>

  <div id="trackpad-zone">
    <div class="pad-hint">slide to move · tap to click · type anywhere</div>
  </div>

  <div class="bottom-bar">
    <div class="click-btns">
      <button class="click-btn" id="lclick-btn">Left click</button>
      <button class="click-btn" id="rclick-btn">Right click</button>
    </div>
    <div class="servo-row">
      <label>Servo</label>
      <input id="servo-slider" type="range" min="0" max="180" value="90">
      <span id="servo-val">90°</span>
      <button id="servo-btn">Set</button>
    </div>
    <div class="type-row">
      <input id="type-input" type="text" placeholder="Tap here to type on PC…">
      <button id="type-btn">Send</button>
    </div>
  </div>
</div>

<!-- Webcam panel -->
<div id="cam-panel">
  <img id="cam-img" alt="camera stream">
  <div id="cam-loading">Connecting to camera…</div>
  <div id="cam-zoom-overlay">
    <button id="cam-zoom-in">+</button>
    <button id="cam-zoom-reset">1×</button>
    <button id="cam-zoom-out">−</button>
  </div>
  <div class="cam-bar">
    <button id="cam-fullscreen">⛶ Fullscreen</button>
    <button id="cam-close">✕ Close</button>
  </div>
</div>

<div id="toast"></div>

<script>
const BASE = 'https://pc.pepc84.com';

function api(endpoint, cmd) {
  fetch(BASE + endpoint, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cmd })
  }).catch(() => {});
}

let toastTimer;
function toast(msg, dur = 1400) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function checkAuth() {
  try {
    const r = await fetch(BASE + '/me', { credentials: 'include' });
    if (r.ok) showMain();
  } catch {}
}

async function login() {
  const u = document.getElementById('u-input').value;
  const p = document.getElementById('p-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const r = await fetch(BASE + '/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    if (r.ok) showMain();
    else err.textContent = 'Wrong username or password.';
  } catch { err.textContent = 'Cannot reach ESP32.'; }
}

function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display  = 'flex';
  pollStatus();
  setInterval(pollStatus, 10000);
  // Auto-focus type input so typing works immediately
  setTimeout(() => document.getElementById('type-input').focus(), 300);
}

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('p-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ── Status ───────────────────────────────────────────────────────────────────
async function pollStatus() {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  try {
    const r = await fetch(BASE + '/status', { credentials: 'include', signal: AbortSignal.timeout(4000) });
    if (r.ok) { dot.className = 'dot online'; txt.textContent = 'ESP32 online'; }
    else throw 0;
  } catch { dot.className = 'dot offline'; txt.textContent = 'ESP32 offline'; }
}

// ── Power ─────────────────────────────────────────────────────────────────────
const HOLD_MS  = 5000;
const CIRCUM   = 2 * Math.PI * 24; // ≈ 150.8
let powerTimer = null, powerRafId = null, powerStart = 0, powerHeld = false;
const powerBtn  = document.getElementById('power-btn');
const powerCirc = document.querySelector('#power-ring circle');
powerCirc.style.strokeDasharray = `0 ${CIRCUM}`;

function powerRingTick() {
  const frac = Math.min((performance.now() - powerStart) / HOLD_MS, 1);
  powerCirc.style.strokeDasharray = `${frac * CIRCUM} ${CIRCUM}`;
  if (frac < 1) powerRafId = requestAnimationFrame(powerRingTick);
}
function powerRingReset() {
  cancelAnimationFrame(powerRafId); powerRafId = null;
  powerCirc.style.strokeDasharray = `0 ${CIRCUM}`;
}

powerBtn.addEventListener('pointerdown', e => {
  e.stopPropagation(); e.preventDefault();
  powerBtn.setPointerCapture(e.pointerId);
  powerHeld = false;
  powerStart = performance.now();
  powerRafId = requestAnimationFrame(powerRingTick);
  powerTimer = setTimeout(() => {
    powerHeld = true; powerTimer = null;
    powerRingReset();
    api('/power', 'hold');
    toast('Force off sent');
  }, HOLD_MS);
});
function powerRelease() {
  powerRingReset();
  if (powerTimer) {
    clearTimeout(powerTimer); powerTimer = null;
    if (!powerHeld) { api('/power', 'press'); toast('Power pressed'); }
  }
  powerHeld = false;
}
powerBtn.addEventListener('pointerup',     e => { e.stopPropagation(); powerRelease(); });
powerBtn.addEventListener('pointercancel', e => { e.stopPropagation(); powerRelease(); });
powerBtn.addEventListener('contextmenu', e => e.preventDefault());

// ── Click buttons ─────────────────────────────────────────────────────────────
document.getElementById('lclick-btn').addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('rclick-btn').addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('lclick-btn').addEventListener('click', () => api('/mouse', 'mc:1'));
document.getElementById('rclick-btn').addEventListener('click', () => api('/mouse', 'mc:2'));

// ── Type ──────────────────────────────────────────────────────────────────────
const typeInput = document.getElementById('type-input');
const typeBtn   = document.getElementById('type-btn');

typeInput.addEventListener('pointerdown', e => e.stopPropagation());
typeBtn.addEventListener('pointerdown',   e => e.stopPropagation());

// Intercept special keys from the type input and forward them as key commands
typeInput.addEventListener('keydown', e => {
  if (e.repeat) return; // ignore held-key repeats
  const specials = {
    'F1':'f1','F2':'f2','F3':'f3','F4':'f4','F5':'f5','F6':'f6',
    'F7':'f7','F8':'f8','F9':'f9','F10':'f10','F11':'f11','F12':'f12',
    'Tab':'tab','Escape':'escape','Delete':'delete','Backspace':'backspace',
    'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right',
    'Home':'home','End':'end','PageUp':'pageup','PageDown':'pagedown',
  };

  // Build modifier prefix
  let prefix = '';
  if (e.ctrlKey)  prefix += 'ctrl+';
  if (e.altKey)   prefix += 'alt+';
  if (e.metaKey)  prefix += 'win+';
  if (e.shiftKey && specials[e.key]) prefix += 'shift+'; // shift+special only

  if (e.key === 'Enter') {
    // Enter without ctrl/alt = send typed text; with modifier = forward Enter
    if (!e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      sendType();
      return;
    }
  }

  if (specials[e.key]) {
    e.preventDefault();
    api('/key', prefix + specials[e.key]);
    return;
  }

  // Ctrl/Alt/Meta + letter → forward as key combo, don't type locally
  if ((e.ctrlKey || e.altKey || e.metaKey) && e.key.length === 1) {
    e.preventDefault();
    api('/key', prefix + e.key.toLowerCase());
  }
  // All other keys (printable chars, space, backspace) pass through to the input normally
  // They accumulate in the input and get sent on Enter or Send button
});

async function sendType() {
  const val = typeInput.value;
  if (!val) return;

  typeBtn.textContent = '…';
  typeBtn.disabled = true;

  try {
    const r = await fetch(BASE + '/mouse', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: 'type:' + val })
    });
    if (r.ok) {
      typeInput.value = '';
      typeBtn.classList.add('ok');
      typeBtn.textContent = 'Sent';
    } else {
      typeBtn.classList.add('err');
      typeBtn.textContent = 'Err';
      toast('ESP32 error');
    }
  } catch {
    typeBtn.classList.add('err');
    typeBtn.textContent = 'Err';
    toast('Cannot reach ESP32');
  }

  setTimeout(() => {
    typeBtn.classList.remove('ok', 'err');
    typeBtn.textContent = 'Send';
    typeBtn.disabled = false;
    typeInput.focus(); // keep focus so they can keep typing
  }, 1000);
}

typeBtn.addEventListener('click', sendType);

// ── Servo ─────────────────────────────────────────────────────────────────────
const servoSlider = document.getElementById('servo-slider');
const servoVal    = document.getElementById('servo-val');
const servoBtn    = document.getElementById('servo-btn');

servoSlider.addEventListener('input', () => {
  servoVal.textContent = servoSlider.value + '°';
});
servoSlider.addEventListener('pointerdown', e => e.stopPropagation());

servoBtn.addEventListener('pointerdown', e => e.stopPropagation());
servoBtn.addEventListener('click', () => {
  fetch(BASE + '/servo', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ angle: parseInt(servoSlider.value) })
  }).catch(() => {});
});

// ── Trackpad ──────────────────────────────────────────────────────────────────
const zone = document.getElementById('trackpad-zone');
let pt = null, accX = 0, accY = 0, lastSend = 0;
const SENS     = 3.5;
const THROTTLE = 35;
const TAP_DIST = 8;

function spawnRipple(x, y) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = x + 'px'; r.style.top = y + 'px';
  zone.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
}

zone.addEventListener('pointerdown', e => {
  zone.setPointerCapture(e.pointerId);
  pt = { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, moved: false };
  accX = accY = 0;
  e.preventDefault();
});

zone.addEventListener('pointermove', e => {
  if (!pt) return;
  const dx = (e.clientX - pt.x) * SENS;
  const dy = (e.clientY - pt.y) * SENS;
  accX += dx; accY += dy;
  pt.x = e.clientX; pt.y = e.clientY;
  if (Math.hypot(e.clientX - pt.startX, e.clientY - pt.startY) > TAP_DIST) pt.moved = true;

  const now = performance.now();
  if (now - lastSend >= THROTTLE) {
    const ix = Math.max(-127, Math.min(127, Math.round(accX)));
    const iy = Math.max(-127, Math.min(127, Math.round(accY)));
    if (ix !== 0 || iy !== 0) {
      api('/mouse', `m:${ix},${iy}`);
      accX -= ix; accY -= iy;
      lastSend = now;
    }
  }
});

zone.addEventListener('pointerup', e => {
  if (!pt) return;
  if (!pt.moved) {
    const rect = zone.getBoundingClientRect();
    spawnRipple(e.clientX - rect.left, e.clientY - rect.top);
    api('/mouse', 'mc:1');
  }
  pt = null; accX = accY = 0;
});

zone.addEventListener('pointercancel', () => { pt = null; accX = accY = 0; });

// ── Webcam (MJPEG stream from ESP32S3) ───────────────────────────────────────
const camPanel      = document.getElementById('cam-panel');
const camImg        = document.getElementById('cam-img');
const camLoading    = document.getElementById('cam-loading');
const camToggle     = document.getElementById('cam-toggle');
const camClose      = document.getElementById('cam-close');
const camFullscreen = document.getElementById('cam-fullscreen');

const STREAM_URL = 'https://pc.pepc84.com/stream?token=f5b73f383966e2c5277da113b90086c5f5d6da4368e0434e768e19321c9c001a';

function openCam() {
  camPanel.classList.add('open');
  camToggle.classList.add('active');
  camLoading.style.display = 'flex';
  camImg.src = STREAM_URL;
  camImg.onload = () => { camLoading.style.display = 'none'; };
  camImg.onerror = () => { camLoading.textContent = 'Camera unavailable'; };
}

function closeCam() {
  camImg.src = '';          // stop the stream
  camImg.onload = null;
  camImg.onerror = null;
  camPanel.classList.remove('open');
  camToggle.classList.remove('active');
  camLoading.textContent = 'Connecting to camera…';
  resetZoom();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

camToggle.addEventListener('click', () => {
  if (camPanel.classList.contains('open')) closeCam();
  else openCam();
});
camClose.addEventListener('click', closeCam);

// ── Zoom ──────────────────────────────────────────────────────────────────────
// We use a translate+scale approach where (originX, originY) is the focal point
// in panel-relative coordinates (pixels from panel top-left).
// transform: translate(tx, ty) scale(s)  — applied via CSS on the img.
const MIN_SCALE = 1, MAX_SCALE = 8;
let camScale = 1, camTx = 0, camTy = 0; // tx/ty in px

function clampTranslate(s, tx, ty) {
  const r = camPanel.getBoundingClientRect();
  // At scale s, the image is s× bigger. Max shift so edges stay visible.
  const maxX = r.width  * (s - 1) / 2;
  const maxY = r.height * (s - 1) / 2;
  return [
    Math.max(-maxX, Math.min(maxX, tx)),
    Math.max(-maxY, Math.min(maxY, ty))
  ];
}

function applyZoom() {
  [camTx, camTy] = clampTranslate(camScale, camTx, camTy);
  camImg.style.transform = `translate(${camTx}px, ${camTy}px) scale(${camScale})`;
  camImg.style.cursor = camScale > 1 ? 'grab' : 'zoom-in';
  document.getElementById('cam-zoom-reset').textContent =
    camScale === 1 ? '1×' : camScale.toFixed(1) + '×';
}

function resetZoom() { camScale = 1; camTx = 0; camTy = 0; applyZoom(); }

// Zoom toward a panel-relative focal point (px, py)
function zoomAt(newScale, px, py) {
  const r = camPanel.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  // Focal offset from panel center
  const fx = px - cx, fy = py - cy;
  // Adjust translate so the point under the finger stays fixed
  camTx = fx - (fx - camTx) * (newScale / camScale);
  camTy = fy - (fy - camTy) * (newScale / camScale);
  camScale = newScale;
  applyZoom();
}

// +/- buttons zoom toward/away from panel center
document.getElementById('cam-zoom-in').addEventListener('click', () => {
  const r = camPanel.getBoundingClientRect();
  zoomAt(Math.min(MAX_SCALE, parseFloat((camScale * 1.5).toFixed(2))), r.width / 2, r.height / 2);
});
document.getElementById('cam-zoom-out').addEventListener('click', () => {
  let s = Math.max(MIN_SCALE, parseFloat((camScale / 1.5).toFixed(2)));
  if (s < 1.05) s = 1;
  const r = camPanel.getBoundingClientRect();
  zoomAt(s, r.width / 2, r.height / 2);
});
document.getElementById('cam-zoom-reset').addEventListener('click', resetZoom);

// Pinch-to-zoom + single-finger pan
let pinchDist0 = null, pinchScale0 = 1, pinchMidX = 0, pinchMidY = 0;
let panPt = null;

camImg.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    pinchDist0  = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    pinchScale0 = camScale;
    const r = camPanel.getBoundingClientRect();
    pinchMidX = ((t0.clientX + t1.clientX) / 2) - r.left;
    pinchMidY = ((t0.clientY + t1.clientY) / 2) - r.top;
    panPt = null;
  } else if (e.touches.length === 1) {
    if (camScale > 1) e.preventDefault();
    panPt = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: camTx, ty: camTy };
    pinchDist0 = null;
  }
}, { passive: false });

camImg.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchDist0 !== null) {
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchScale0 * dist / pinchDist0));
    // Translate to keep midpoint fixed, then scale
    const r = camPanel.getBoundingClientRect();
    const midX = ((t0.clientX + t1.clientX) / 2) - r.left;
    const midY = ((t0.clientY + t1.clientY) / 2) - r.top;
    zoomAt(newScale, midX, midY);
  } else if (e.touches.length === 1 && panPt) {
    if (camScale > 1) {
      e.preventDefault();
      camTx = panPt.tx + (e.touches[0].clientX - panPt.x);
      camTy = panPt.ty + (e.touches[0].clientY - panPt.y);
      applyZoom();
    }
  }
}, { passive: false });

camImg.addEventListener('touchend', () => {
  if (camScale < 1.05) resetZoom();
  pinchDist0 = null; panPt = null;
});

// Double-tap to zoom in at tap point, or reset if already zoomed
let lastTap = 0, lastTapX = 0, lastTapY = 0;
camImg.addEventListener('click', e => {
  const now = Date.now();
  if (now - lastTap < 300) {
    e.preventDefault();
    if (camScale > 1.5) {
      resetZoom();
    } else {
      const r = camPanel.getBoundingClientRect();
      zoomAt(3, e.clientX - r.left, e.clientY - r.top);
    }
  }
  lastTap = now; lastTapX = e.clientX; lastTapY = e.clientY;
});

camFullscreen.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    camPanel.requestFullscreen().catch(() => {
      camImg.webkitEnterFullscreen && camImg.webkitEnterFullscreen();
    });
  } else {
    document.exitFullscreen();
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
checkAuth();
</script>
</body>
